<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Quiz Website</title>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="css/styles.css"
</head>
<body>

    <div class="container">
        <h1>Sign up for the quiz</h1>
        <p>Create an account to play, save your scores, and more.</p>

        <form action="https://example.com/apply" method="POST">
        <p>
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" class="login-signup-field" size="10" maxlength="10">
        </p>
        <p>
            <label for="password">Password:</label>
            <input type="password" name="password" id="username" class="login-signup-field" size="10" maxlength="10">
        </p>
        <input type="submit" class="start-btn" value="Sign me up!">
        </form>

        <p><a href="login.html">I already have an account!</a></p>
    </div>

</body>
</html>
